<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Servicios</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

    <div class="container my-4">
        <div class="card shadow-sm">
            <div class="card-header bg-white border-0 pt-3">
                <h3 class="fw-bold text-dark"><i class="bi bi-window-sidebar me-2"></i>Portal de Servicios</h3>
                <!-- Barra de navegación -->
                <nav class="nav nav-pills bg-light p-2 rounded mt-2">
                    <a class="nav-link" href="{{ url_for('index') }}">Inicio</a>
                    <a class="nav-link" href="{{ url_for('compra') }}">Compra</a>
                    <a class="nav-link" href="{{ url_for('salario') }}">Salario</a>
                    <a class="nav-link" href="{{ url_for('temperatura') }}">Temperatura</a>
                    <a class="nav-link" href="{{ url_for('empresa') }}">Empresa</a>
                    <a class="nav-link" href="{{ url_for('servicios') }}">Servicios</a>
                    <a class="nav-link" href="{{ url_for('contacto') }}">Contacto</a>
                </nav>
            </div>
            
            <div class="card-body p-4">
                <!-- Aquí se insertará el contenido de cada página -->
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
